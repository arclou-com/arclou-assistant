  /v1/finance/insights/{insight_id}/dismiss:
    parameters:
      - { name: insight_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [Finanças]
      operationId: dismissInsight
      summary: Dispensa uma orientação (F01)
      responses:
        '204': { description: Dispensada }

  /v1/transactions:
    get:
      tags: [Finanças]
      operationId: listTransactions
      summary: Lançamentos com filtros (F01 "maiores gastos", seletor "Mover da minha conta" em H01)
      parameters:
        - $ref: '#/components/parameters/Month'
        - { name: kind, in: query, schema: { type: string, enum: [expense, income] } }
        - { name: category_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: visibility, in: query, schema: { $ref: '#/components/schemas/Visibility' } }
        - { name: q, in: query, description: Busca na descrição, schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [date_desc, amount_desc], default: date_desc } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lançamentos
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
    post:
      tags: [Finanças]
      operationId: createTransaction
      summary: Novo lançamento pelo painel (inclui o da Casa em HJ01b)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/transactions/preview:
    post:
      tags: [Finanças]
      operationId: previewTransaction
      summary: Efeito de um lançamento antes de salvar (saldo da conjunta em HJ01b, partes em H01d)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '200':
          description: Efeitos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionEffects' }
              example:
                shares: [{ user_id: 0192f0a0-0000-7000-8000-000000000001, name: Marina, share_cents: 23913 }, { user_id: 0192f0a0-0000-7000-8000-000000000002, name: João, share_cents: 17317 }]
                joint_balance_after_cents: 919130
                household_balance_after: null
                limit_alerts: []
                messages: ['Da casa: os dois veem tudo, e o valor sai do saldo da conjunta.']

  /v1/transactions/{transaction_id}:
    parameters:
      - { name: transaction_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [Finanças]
      operationId: getTransaction
      summary: Detalhes do lançamento (H01 "Ver detalhes e divisão")
      responses:
        '200':
          description: Lançamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Finanças]
      operationId: updateTransaction
      summary: Edita descrição, valor, data e categoria (H01 "Editar lançamento"). As partes são recalculadas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Finanças]
      operationId: deleteTransaction
      summary: Exclui (soft delete; pode ser restaurado por 10 min)
      responses:
        '200':
          description: Excluído
          content:
            application/json:
              schema:
                type: object
                required: [undo_until]
                properties:
                  undo_until: { type: string, format: date-time }

  /v1/transactions/{transaction_id}/restore:
    parameters:
      - { name: transaction_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [Finanças]
      operationId: restoreTransaction
      summary: Desfaz a exclusão (toast "Desfazer")
      responses:
        '200':
          description: Restaurado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/transactions/{transaction_id}/visibility:
    parameters:
      - { name: transaction_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    put:
      tags: [Casa]
      operationId: setTransactionVisibility
      summary: Pessoal, da casa ou dividido (H01d, "Remover da Casa", "Mover da minha conta")
      description: Só quem registrou pode mudar (RN-11.3).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisibilityInput' }
      responses:
        '200':
          description: Lançamento atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/transactions/{transaction_id}/visibility/preview:
    parameters:
      - { name: transaction_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [Casa]
      operationId: previewTransactionVisibility
      summary: Efeito no saldo da Casa antes de mudar a visibilidade ("João te deve R$ 391,55 → R$ 218,38")
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisibilityInput' }
      responses:
        '200':
          description: Efeitos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionEffects' }
              example:
                shares: []
                joint_balance_after_cents: null
                household_balance_after: { debtor_name: João, creditor_name: Marina, before_cents: 39155, after_cents: 21838 }
                limit_alerts: []
                messages: ['“Mercado” (R$ 412,30) volta a ser só seu, e o João deixa de ver.']

  /v1/transactions/export.csv:
    get:
      tags: [Finanças]
      operationId: exportTransactionsCsv
      summary: Exportar CSV (F01, RF-89)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Arquivo CSV (separador `;`, UTF-8 com BOM)
          content:
            text/csv:
              schema: { type: string }

  /v1/incomes:
    get:
      tags: [Finanças]
      operationId: listIncomes
      summary: Receitas do mês (F02 "Receitas de outubro")
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Receitas do mês e próxima prevista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomeMonth' }
              example:
                month: '2026-10'
                total_cents: 585000
                items:
                  - { id: 0192f120-0000-7000-8000-000000000001, kind: recurring, description: Salário, schedule_label: Renda fixa · todo dia 5, amount_cents: 520000, variable: false, occurrence: { id: 0192f121-0000-7000-8000-000000000001, expected_on: '2026-10-05', expected_cents: 520000, status: received, received_on: '2026-10-05', received_cents: 520000 } }
                  - { id: 0192f120-0000-7000-8000-000000000002, kind: extra, description: Freela de design, schedule_label: Receita extra · 10/10, amount_cents: 65000, variable: false, occurrence: null }
                next_expected: { description: Salário, expected_on: '2026-11-05', amount_cents: 520000 }
    post:
      tags: [Finanças]
      operationId: createIncome
      summary: Nova receita recorrente (F02b) ou extra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeInput' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/incomes/preview:
    post:
      tags: [Finanças]
      operationId: previewIncome
      summary: Próximos recebimentos previstos (quadro em F02b)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeInput' }
      responses:
        '200':
          description: Próximas ocorrências
          content:
            application/json:
              schema:
                type: object
                required: [occurrences]
                properties:
                  occurrences:
                    type: array
                    items: { $ref: '#/components/schemas/IncomePreviewItem' }
              example:
                occurrences:
