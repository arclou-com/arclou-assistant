openapi: 3.1.0
info:
  title: Arclou API
  version: 0.1.0
  summary: API do painel web da Arclou (assistente pessoal de finanças, agenda e e-mail pelo WhatsApp).
  description: |
    Contrato que faz **todas as telas do painel web** funcionarem (doc 13).
    O front é construído contra o mock (Prism) gerado deste arquivo; o backend implementa exatamente o que está aqui.

    **Convenções**
    - Autenticação: `Authorization: Bearer <Firebase ID token>`. Rotas públicas têm `security: []`.
    - Dinheiro: sempre **inteiro em centavos** (`*_cents`), moeda BRL. O front nunca faz conta de dinheiro: totais, percentuais,
      projeções e simulações vêm prontos da API (endpoints `…/preview`).
    - Datas: `date` = `AAAA-MM-DD` no fuso do usuário; `date-time` = ISO 8601 com fuso. Mês de referência: `AAAA-MM`.
    - IDs: UUID v7 em string.
    - Listas: paginação por cursor (`?cursor=&limit=`), resposta `{ items, next_cursor }`.
    - Erros: `application/problem+json` (RFC 9457) com `code` estável e `errors[]` por campo.
    - Criações sensíveis (checkout, pagamentos, acertos) aceitam `Idempotency-Key`.
    - Telas que "atualizam sozinhas" fazem polling a cada 3 s no GET do recurso (o campo `status` muda).
    - Mock: o header `Prefer: code=404` ou `Prefer: example=<nome>` escolhe o estado (vazio, erro, pendente).
  contact:
    name: Arclou
    url: https://github.com/arclou-com/arclou-assistant
servers:
  - url: https://api.arclou.com.br
    description: Production
  - url: https://api.stg.arclou.com.br
    description: Staging
  - url: http://localhost:4010
    description: Mock (Prism)
security:
  - firebase: []
tags:
  - name: Planos e checkout
    description: Página de vendas, criar conta e pagamento (C02–C06, CC02–CC06, MC*)
  - name: Conta
    description: Perfil, preferências, categorias e visão geral (02, 05, M02, M05)
  - name: WhatsApp
    description: Vínculo do número e mensagens proativas (03, 03b)
  - name: Integrações
    description: Google Calendar e Gmail (04, E09)
  - name: Assinatura
    description: Plano, uso, cobranças, troca e cancelamento (06, M06)
  - name: Privacidade
    description: Memória da assistente, exportação e exclusão de conta (07, M07)
  - name: Finanças
    description: Visão do mês, lançamentos, receitas, limites, planejamento, metas e simulação (F01–F03)
  - name: Compromissos
    description: Gastos recorrentes, cartões e compras parceladas (F04, F05 e ações)
  - name: Casa
    description: Finanças a dois — convite, divisão, saldo, conta conjunta e saída (H*, HJ*, HS*, J*, JD*)
  - name: Central de Ajuda
    description: Busca e feedback dos artigos (ajuda.arclou.com.br)

paths:
  # ───────────────────────────── Planos e checkout ─────────────────────────────
  /v1/plans:
    get:
      tags: [Planos e checkout]
      operationId: listPlans
      summary: Planos à venda (página de vendas, C02, troca de plano)
      security: []
      responses:
        '200':
          description: Planos ativos
          content:
            application/json:
              schema:
                type: object
                required: [items, founder_offer]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Plan' }
                  founder_offer: { $ref: '#/components/schemas/FounderOffer' }
              example:
                items:
                  - code: essencial
                    name: Essencial
                    price_cents: 1990
                    trial_days: 7
                    seats: 1
                    daily_price_cents: 66
                    highlight: false
                    features: ['Gastos por texto, áudio e foto', Limites e alertas, Contas fixas e parcelas, Lembretes]
                    quotas: { messages: 600, proactive: 60, receipts: 30 }
                  - code: pro
                    name: Pro
                    price_cents: 3490
                    trial_days: 7
                    seats: 1
                    daily_price_cents: 116
                    highlight: true
                    features: [Tudo do Essencial, Agenda e Gmail, Planejamento e metas, 'Posso comprar?', Orientações semanais, Resumo diário às 7h]
                    quotas: { messages: 1200, proactive: 100, receipts: 100 }
                  - code: casal
                    name: Casal
                    price_cents: 4990
                    trial_days: 7
                    seats: 2
                    daily_price_cents: 83
                    highlight: false
                    features: [Duas contas Pro, Casa compartilhada, Quem deve quem, Conta conjunta]
                    quotas: { messages: 900, proactive: 60, receipts: 60 }
                founder_offer:
                  active: true
                  plan_code: pro
                  price_cents: 2490
                  months: 12
                  spots_left: 37

  /v1/coupons/{code}:
    get:
      tags: [Planos e checkout]
      operationId: validateCoupon
      summary: Valida um cupom ("Tenho um cupom" em C03)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 40 } }
        - { name: plan_code, in: query, required: true, schema: { $ref: '#/components/schemas/PlanCode' } }
      responses:
        '200':
          description: Cupom válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coupon' }
              example: { code: AMIGO10, valid: true, description: 10% de desconto por 3 meses, discount_pct: 10, months: 3 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/consents:
    post:
      tags: [Planos e checkout]
      operationId: recordConsent
      summary: Registra o aceite dos termos (checkbox em C02, JD02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '201':
          description: Aceite registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/checkout/sessions:
    post:
      tags: [Planos e checkout]
      operationId: createCheckoutSession
      summary: Inicia o checkout depois de criar a conta (C02 → C03)
      description: O usuário já está autenticado no Firebase. Nada é cobrado hoje (teste de 7 dias).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code]
              properties:
                plan_code: { $ref: '#/components/schemas/PlanCode' }
                coupon_code: { type: [string, 'null'], maxLength: 40 }
                founder_price: { type: boolean, default: false, description: Usa o preço de fundador se houver vaga }
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '409':
          $ref: '#/components/responses/Conflict'
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/checkout/sessions/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [Planos e checkout]
      operationId: getCheckoutSession
      summary: Estado da sessão (polling em C04 e dados de C06)
      responses:
        '200':
          description: Sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
              examples:
                pendente_pix:
                  value:
                    id: 0192f0a1-7c1e-7b3a-9f10-1a2b3c4d5e6f
                    plan_code: pro
                    status: awaiting_pix_authorization
                    payment_method: pix_automatic
                    price_cents: 3490
                    first_charge_cents: 3490
                    trial_ends_on: '2026-10-20'
                    first_charge_on: '2026-10-20'
                    coupon: null
                    pix: { copy_paste: '00020101021226860014br.gov.bcb.pix...', qr_code_svg: '<svg/>', expires_at: '2026-10-13T17:30:00-03:00', max_amount_cents: 3490 }
                    receipt_email: marina@gmail.com
                    decline: null
                confirmada:
                  value:
                    id: 0192f0a1-7c1e-7b3a-9f10-1a2b3c4d5e6f
                    plan_code: pro
                    status: completed
                    payment_method: card
                    price_cents: 3490
                    first_charge_cents: 3490
                    trial_ends_on: '2026-10-20'
                    first_charge_on: '2026-10-20'
                    coupon: null
                    card: { brand: visa, last4: '4821' }
                    receipt_email: marina@gmail.com
                    decline: null
                recusada:
                  value:
                    id: 0192f0a1-7c1e-7b3a-9f10-1a2b3c4d5e6f
                    plan_code: pro
                    status: declined
                    payment_method: card
                    price_cents: 3490
                    first_charge_cents: 3490
                    trial_ends_on: '2026-10-20'
                    first_charge_on: '2026-10-20'
                    coupon: null
                    receipt_email: marina@gmail.com
                    decline: { reason: insufficient_funds, message: O banco recusou o cartão. Tente outro cartão ou o Pix Automático. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/checkout/sessions/{session_id}/card:
    parameters:
      - { name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [Planos e checkout]
      operationId: payCheckoutWithCard
      summary: Confirma com cartão (C03 → C06 ou C05)
      description: |
        O número do cartão **nunca** passa pela API: o front tokeniza com o SDK do gateway (decisão no S12-01) e envia só o token.
        No mock, qualquer `card_token` é aceito; `tok_declined` devolve a sessão recusada.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_token, holder_name, holder_cpf]
              properties:
                card_token: { type: string }
                holder_name: { type: string, maxLength: 80 }
                holder_cpf: { $ref: '#/components/schemas/Cpf' }
      responses:
        '200':
          description: Sessão atualizada (`completed` ou `declined`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/checkout/sessions/{session_id}/pix-automatic:
    parameters:
      - { name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [Planos e checkout]
      operationId: payCheckoutWithPixAutomatic
      summary: Gera a autorização do Pix Automático (C04)
      description: Devolve o QR Code e o copia e cola. O front faz polling em `getCheckoutSession` até `completed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payer_cpf]
              properties:
                payer_cpf: { $ref: '#/components/schemas/Cpf' }
      responses:
        '200':
          description: Sessão aguardando autorização
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }

  # ───────────────────────────── Conta ─────────────────────────────
  /v1/me:
    get:
      tags: [Conta]
      operationId: getMe
      summary: Usuário logado (sidebar, 05, M05)
      description: No primeiro acesso, o usuário é criado a partir do token do Firebase (S1-06).
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: 0192f0a0-0000-7000-8000-000000000001
                email: marina@gmail.com
                full_name: Marina Costa
                preferred_name: Marina
                initials: MC
                cpf: '123.456.789-09'
                customer_since: '2026-10-13'
                is_admin: false
                onboarding_completed: false
                preferences:
                  timezone: America/Sao_Paulo
                  currency: BRL
                  locale: pt-BR
                  week_start: monday
                  daily_summary_time: '07:00'
                  reminder_lead_minutes: 30
                  default_payment_method: credit_card
                  month_start_day: 1
                  theme: light
                security:
                  password_set: true
                  password_changed_at: '2026-10-13T16:00:00-03:00'
                  google_linked: true
                  google_email: marina@gmail.com
                plan: { code: pro, name: Pro, status: trialing }
                household: { id: 0192f0b0-0000-7000-8000-000000000001, role: owner }
    patch:
      tags: [Conta]
      operationId: updateMe
      summary: Salva perfil e preferências (05)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/overview:
    get:
      tags: [Conta]
      operationId: getOverview
      summary: Visão geral do painel (02, M02)
      responses:
        '200':
          description: Configuração, integrações e uso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
              example:
                greeting_name: Marina
                setup:
                  completed_steps: 2
                  total_steps: 4
                  next_step: whatsapp
                  message: Conecte o WhatsApp para começar a conversar com a Arclou.
                  steps:
                    - { key: account, label: Conta criada, done: true }
                    - { key: plan, label: Plano escolhido, done: true }
                    - { key: whatsapp, label: WhatsApp vinculado, done: false }
                    - { key: google, label: Agenda e e-mail (opcional), done: false }
                connections:
                  whatsapp: { status: not_linked, detail: Nenhum número vinculado }
                  google_calendar: { status: connected, detail: marina@gmail.com · 3 agendas }
                  gmail: { status: connected, detail: Leitura e envio com confirmação }
                usage:
                  renews_on: '2026-10-20'
                  messages: { used: 128, limit: 1200 }
                  proactive: { used: 12, limit: 100 }
                  receipts: { used: 4, limit: 100 }
                suggestions:
                  - gastei 32,90 na padaria
                  - o que tenho amanhã de manhã?
                  - me lembra de pagar a luz dia 15
                  - tenho algum e-mail importante hoje?

  /v1/categories:
    get:
      tags: [Conta]
      operationId: listCategories
      summary: Categorias padrão e próprias (05 e seletores de categoria)
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [expense, income] } }
      responses:
        '200':
          description: Categorias
          content:
            application/json:
              schema:
                type: object
                required: [items, custom_limit, custom_count]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Category' } }
                  custom_limit: { type: integer, example: 30 }
                  custom_count: { type: integer, example: 1 }
              example:
                custom_limit: 30
                custom_count: 1
                items:
                  - { id: 0192f0c0-0000-7000-8000-000000000001, name: Alimentação, icon: utensils, kind: expense, is_default: true, budget_group: needs }
                  - { id: 0192f0c0-0000-7000-8000-000000000002, name: Mercado, icon: cart, kind: expense, is_default: true, budget_group: needs }
                  - { id: 0192f0c0-0000-7000-8000-000000000003, name: Transporte, icon: car, kind: expense, is_default: true, budget_group: needs }
                  - { id: 0192f0c0-0000-7000-8000-000000000004, name: Moradia, icon: home, kind: expense, is_default: true, budget_group: needs }
                  - { id: 0192f0c0-0000-7000-8000-000000000005, name: Saúde, icon: shield, kind: expense, is_default: true, budget_group: needs }
                  - { id: 0192f0c0-0000-7000-8000-000000000006, name: Lazer, icon: sparkles, kind: expense, is_default: true, budget_group: wants }
                  - { id: 0192f0c0-0000-7000-8000-000000000007, name: Assinaturas, icon: smartphone, kind: expense, is_default: true, budget_group: wants }
                  - { id: 0192f0c0-0000-7000-8000-000000000008, name: Pet, icon: tag, kind: expense, is_default: false, budget_group: needs }
                  - { id: 0192f0c0-0000-7000-8000-000000000009, name: Viagem, icon: plane, kind: expense, is_default: false, budget_group: wants }
    post:
      tags: [Conta]
      operationId: createCategory
      summary: Nova categoria própria (máx. 30)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/categories/{category_id}:
    parameters:
      - { name: category_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    patch:
      tags: [Conta]
      operationId: updateCategory
      summary: Renomeia, troca ícone ou grupo do 50/30/20
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Conta]
      operationId: deleteCategory
      summary: Remove categoria própria (os lançamentos vão para `replacement_id`)
      parameters:
        - { name: replacement_id, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '204': { description: Removida }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── WhatsApp ─────────────────────────────
  /v1/whatsapp:
    get:
      tags: [WhatsApp]
      operationId: getWhatsApp
      summary: Estado do vínculo (03 com polling, 03b)
      responses:
        '200':
          description: Vínculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppLink' }
              examples:
                conectado:
                  value:
                    status: linked
                    phone: '+55 (11) 98765-4321'
                    linked_at: '2026-10-13T16:42:00-03:00'
                    last_message_at: '2026-10-15T10:20:00-03:00'
                    pending: null
                    arclou_contact: { display_name: Arclou · contato oficial, phone: '+55 11 4000-0000', wa_link: 'https://wa.me/551140000000' }
                    settings: { proactive_opt_in: true, daily_summary: true, budget_alerts: true, insights: true, partner_notifications: false }
                aguardando:
                  value:
                    status: pending
                    phone: null
                    linked_at: null
                    last_message_at: null
                    pending:
                      phone: '+55 (11) 98765-4321'
                      code: VINCULAR-7Q4K2M
                      expires_at: '2026-10-13T17:11:00-03:00'
                      wa_link: 'https://wa.me/551140000000?text=VINCULAR-7Q4K2M'
                    arclou_contact: { display_name: Arclou · contato oficial, phone: '+55 11 4000-0000', wa_link: 'https://wa.me/551140000000' }
                    settings: { proactive_opt_in: false, daily_summary: true, budget_alerts: true, insights: true, partner_notifications: false }
    delete:
      tags: [WhatsApp]
      operationId: unlinkWhatsApp
      summary: Desvincula o número (03b)
      responses:
        '204': { description: Desvinculado }

  /v1/whatsapp/link-code:
    post:
      tags: [WhatsApp]
      operationId: createWhatsAppLinkCode
      summary: Gera o código de vínculo (03 e "Trocar número")
      description: Código de uso único, válido por 30 min (RN-01). Ao vincular um número novo, o anterior é desvinculado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
      responses:
        '201':
          description: Código gerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppLink' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/whatsapp/settings:
    patch:
      tags: [WhatsApp]
      operationId: updateWhatsAppSettings
      summary: Liga e desliga as mensagens da Arclou (03b, RF-06)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WhatsAppSettings' }
      responses:
        '200':
          description: Vínculo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhatsAppLink' }

  # ───────────────────────────── Integrações ─────────────────────────────
  /v1/integrations:
    get:
      tags: [Integrações]
      operationId: listIntegrations
      summary: Google Calendar e Gmail (04, E09 com polling, M04)
      responses:
        '200':
          description: Integrações
          content:
            application/json:
              schema:
                type: object
                required: [google_calendar, gmail]
                properties:
                  google_calendar: { $ref: '#/components/schemas/Integration' }
                  gmail: { $ref: '#/components/schemas/Integration' }
              example:
                google_calendar:
                  product: google_calendar
                  status: connected
                  account_email: marina@gmail.com
                  connected_at: '2026-10-13T16:50:00-03:00'
                  available_on_plan: true
                  calendars:
                    - { id: primary, name: Marina Costa, selected: true, color: '#3B82F6' }
                    - { id: trabalho, name: Trabalho, selected: true, color: '#10B981' }
                    - { id: academia, name: Academia, selected: true, color: '#F59E0B' }
                gmail:
                  product: gmail
                  status: pending
                  account_email: null
                  connected_at: null
                  available_on_plan: true
                  calendars: []

  /v1/integrations/google/authorize:
    post:
      tags: [Integrações]
      operationId: startGoogleAuthorization
      summary: Abre a janela do Google (04 → E09)
      description: |
        Devolve a URL de consentimento (authorization code + PKCE, `state` assinado). O front abre em popup e faz polling em
        `listIntegrations` até `connected`. O callback (`/v1/integrations/google/callback`) é do backend e fecha o popup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product: { type: string, enum: [google_calendar, gmail] }
      responses:
        '200':
          description: URL de autorização
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_at]
                properties:
                  authorization_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
              example: { authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?client_id=...', expires_at: '2026-10-13T17:00:00-03:00' }
        '403': { $ref: '#/components/responses/PlanRequired' }

  /v1/integrations/google/calendars:
    put:
      tags: [Integrações]
      operationId: selectGoogleCalendars
      summary: Escolhe as agendas que a Arclou pode usar (04)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected_ids]
              properties:
                selected_ids: { type: array, items: { type: string }, minItems: 1 }
      responses:
        '200':
          description: Integração atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }

  /v1/integrations/{product}:
    parameters:
      - { name: product, in: path, required: true, schema: { type: string, enum: [google_calendar, gmail] } }
    delete:
      tags: [Integrações]
      operationId: revokeIntegration
      summary: Revoga o acesso (04 "Revogar acesso" e "Cancelar" em E09)
      responses:
        '204': { description: Revogado }

  # ───────────────────────────── Assinatura ─────────────────────────────
  /v1/subscription:
    get:
      tags: [Assinatura]
      operationId: getSubscription
      summary: Plano atual e forma de pagamento (06, M06)
      responses:
        '200':
          description: Assinatura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
              example:
                plan: { code: pro, name: Pro, price_cents: 3490, seats: 1 }
                status: trialing
                founder_price: false
                trial_ends_on: '2026-10-20'
                current_period_start: '2026-10-13'
                current_period_end: '2026-10-20'
                next_charge_on: '2026-10-20'
                next_charge_cents: 3490
                cancel_at_period_end: false
                access_until: null
                payment_method: { type: card, brand: visa, last4: '4821', description: Visa final 4821 }
                included: ['Gastos por texto, áudio e foto', Agenda e lembretes ilimitados na conversa, 'Gmail: resumo, busca e respostas', Resumo diário às 7h, 100 lembretes proativos por mês]
                grace: null

  /v1/subscription/usage:
    get:
      tags: [Assinatura]
      operationId: getUsage
      summary: Uso do ciclo atual (06, 02)
      responses:
        '200':
          description: Uso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
              example:
                period_start: '2026-10-13'
                period_end: '2026-10-20'
                renews_in_days: 7
                alert_threshold_pct: 80
                messages: { used: 128, limit: 1200, used_pct: 11 }
                proactive: { used: 12, limit: 100, used_pct: 12 }
                receipts: { used: 4, limit: 100, used_pct: 4 }

  /v1/subscription/invoices:
    get:
      tags: [Assinatura]
      operationId: listInvoices
      summary: Cobranças (tabela em 06)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cobranças
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BillingInvoice' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                next_cursor: null
                items:
                  - { id: 0192f0d0-0000-7000-8000-000000000002, date: '2026-10-20', description: Arclou Pro · mensal, amount_cents: 3490, status: scheduled, receipt_url: null }
                  - { id: 0192f0d0-0000-7000-8000-000000000001, date: '2026-10-13', description: Início do teste grátis, amount_cents: 0, status: paid, receipt_url: 'https://api.arclou.com.br/v1/subscription/invoices/0192f0d0-0000-7000-8000-000000000001/receipt.pdf' }

  /v1/subscription/plan-change/preview:
    post:
      tags: [Assinatura]
      operationId: previewPlanChange
      summary: Mostra o efeito de trocar de plano (D06, "Mudar para o Casal e convidar" em H02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code]
              properties:
                plan_code: { $ref: '#/components/schemas/PlanCode' }
      responses:
        '200':
          description: Efeito da troca
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanChangePreview' }
              example:
                from_plan: pro
                to_plan: casal
                effective: immediately
                new_price_cents: 4990
                prorated_charge_cents: 0
                next_charge_on: '2026-10-20'
                quota_changes: ['Mensagens: 1.200 → 900 por pessoa', 'Lembretes proativos: 100 → 60 por pessoa']
                notes: [Seu parceiro(a) ganha uma conta Pro sem pagar nada., O teste grátis continua até 20/10/2026.]

  /v1/subscription/plan-change:
    post:
      tags: [Assinatura]
      operationId: changePlan
      summary: Troca de plano (upgrade imediato, downgrade no fim do ciclo)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code]
              properties:
                plan_code: { $ref: '#/components/schemas/PlanCode' }
      responses:
        '200':
          description: Assinatura atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/subscription/payment-method:
    post:
      tags: [Assinatura]
      operationId: changePaymentMethod
      summary: Troca a forma de pagamento (06 "Forma de pagamento")
      description: Abre uma sessão de checkout `purpose=payment_method` reaproveitando as rotas de cartão e Pix Automático.
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }

  /v1/subscription/cancel:
    post:
      tags: [Assinatura]
      operationId: cancelSubscription
      summary: Cancela no fim do período pago (06 "Cancelar assinatura")
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [price, not_using, missing_feature, technical_issue, other] }
                comment: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Assinatura com `cancel_at_period_end = true`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /v1/subscription/resume:
    post:
      tags: [Assinatura]
      operationId: resumeSubscription
      summary: Desfaz o cancelamento antes do fim do período
      responses:
        '200':
          description: Assinatura reativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  # ───────────────────────────── Privacidade ─────────────────────────────
  /v1/memory/facts:
    get:
      tags: [Privacidade]
      operationId: listMemoryFacts
      summary: O que a Arclou lembra sobre você (07)
      responses:
        '200':
          description: Fatos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MemoryFact' } }
              example:
                items:
                  - { id: 0192f0e0-0000-7000-8000-000000000001, fact: Meu cartão principal é o Nubank, created_at: '2026-10-13T18:00:00-03:00' }
                  - { id: 0192f0e0-0000-7000-8000-000000000002, fact: 'Academia às terças e quintas, 7h', created_at: '2026-10-13T18:05:00-03:00' }
                  - { id: 0192f0e0-0000-7000-8000-000000000003, fact: O aluguel vence todo dia 5, created_at: '2026-10-14T09:00:00-03:00' }
                  - { id: 0192f0e0-0000-7000-8000-000000000004, fact: Prefiro lembretes 1 hora antes de reuniões, created_at: '2026-10-14T09:10:00-03:00' }
    delete:
      tags: [Privacidade]
      operationId: clearMemoryFacts
      summary: Limpa toda a memória (07)
      responses:
        '204': { description: Memória apagada }

  /v1/memory/facts/{fact_id}:
    parameters:
      - { name: fact_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    delete:
      tags: [Privacidade]
      operationId: deleteMemoryFact
      summary: Esquece um fato (07)
      responses:
        '204': { description: Removido }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/privacy/export:
    get:
      tags: [Privacidade]
      operationId: getDataExport
      summary: Estado do último pedido de exportação (07)
      responses:
        '200':
          description: Pedido mais recente ou `null`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DataExport'
                  - type: 'null'
    post:
      tags: [Privacidade]
      operationId: requestDataExport
      summary: Solicita o arquivo com conversas, gastos e preferências (link por e-mail em até 48 h)
      responses:
        '202':
          description: Pedido aceito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/privacy/account-deletion:
    post:
      tags: [Privacidade]
      operationId: requestAccountDeletion
      summary: Exclui a conta (07). Revoga conexões e apaga os dados em até 15 dias (RN-08)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, const: EXCLUIR, description: O usuário digita EXCLUIR para confirmar }
                reason: { type: string, maxLength: 500 }
      responses:
        '202':
          description: Exclusão agendada
          content:
            application/json:
              schema:
                type: object
                required: [scheduled_for]
                properties:
                  scheduled_for: { type: string, format: date }
                  household_effect: { type: [string, 'null'], description: 'O que acontece com a Casa, se houver' }
        '422': { $ref: '#/components/responses/ValidationError' }

