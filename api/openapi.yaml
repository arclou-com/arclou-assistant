                  - { id: s3, description: Assinatura de streaming, hint: Recorrente da casa ainda não confirmada este mês, amount_cents: 5970, selected: true }
                selected_total_cents: 10260
                unexplained_cents: 3870
                message: 'Lançando os 2 marcados (R$ 102,60), sobra R$ 38,70 sem explicação. Ele vira um ajuste visível para os dois.'

  /v1/household/joint-account/reconciliation:
    post:
      tags: [Casa]
      operationId: reconcileJointAccount
      summary: Lança as sugestões marcadas e o ajuste da diferença
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_balance_cents, suggestion_ids]
              properties:
                bank_balance_cents: { $ref: '#/components/schemas/Cents' }
                suggestion_ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Conta conjunta conferida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JointAccount' }

  /v1/transactions/{transaction_id}/reveal:
    parameters:
      - { name: transaction_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [Casa]
      operationId: revealPrivateTransaction
      summary: Mostra um item Privado ao parceiro ("pode mostrar o presente", RN-11.15)
      responses:
        '200':
          description: Lançamento atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/household/leave/preview:
    get:
      tags: [Casa]
      operationId: previewLeaveHousehold
      summary: Sair da Casa — o que acontece (HS01)
      responses:
        '200':
          description: Consequências
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeavePreview' }
              example:
                joint_account_last_balance_cents: 919130
                pending_balance: null
                goals:
                  - { goal_id: 0192f180-0000-7000-8000-000000000001, name: Viagem de fim de ano, mine_cents: 139200, partner_cents: 100800 }
                history_read_only_until: '2027-01-12'
                my_plan_after: { code: pro, price_cents: 3490, label: 'Você é a titular: seu plano vira Pro (R$ 34,90/mês).' }
                partner_plan_after: O João escolhe entre o teste grátis e o Essencial.
                partner_notice: Ele recebe uma mensagem no WhatsApp dizendo que você saiu da Casa, sem nenhum motivo.
                items:
                  - { key: joint_account, title: Conta conjunta, body: 'A Arclou não mexe no dinheiro do banco. O último saldo registrado (R$ 9.191,30) fica no histórico, e no próximo passo vocês anotam como vão dividir.' }
                  - { key: goals, title: Meta “Viagem de fim de ano”, body: 'Cada um leva o que guardou: você fica com R$ 1.392 e o João com R$ 1.008.' }
                  - { key: history, title: Histórico da Casa, body: Fica somente leitura para os dois por 90 dias (até 12/01/2027). Cada um pode exportar. }
                  - { key: personal_data, title: Seus dados pessoais, body: Nunca foram compartilhados e continuam só seus. }
                  - { key: plan, title: Plano, body: 'Você é a titular: seu plano vira Pro (R$ 34,90/mês). O João escolhe entre o teste grátis e o Essencial.' }
                  - { key: notice, title: Aviso ao João, body: 'Ele recebe uma mensagem no WhatsApp dizendo que você saiu da Casa, sem nenhum motivo.' }
                undo_window_hours: 24
                confirmation_word: SAIR

  /v1/household/leave:
    post:
      tags: [Casa]
      operationId: leaveHousehold
      summary: Confirma a saída (HS02 + HS03). Pode ser desfeita por 24 h
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, const: SAIR }
                joint_split:
                  oneOf:
                    - type: object
                      required: [mode]
                      properties:
                        mode: { type: string, enum: [equal, custom, later] }
                        mine_cents: { $ref: '#/components/schemas/Cents' }
                        partner_cents: { $ref: '#/components/schemas/Cents' }
                    - type: 'null'
                add_my_share_as_opening_balance: { type: boolean, default: false }
      responses:
        '200':
          description: Saída agendada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Casa]
      operationId: undoLeaveHousehold
      summary: Desfaz a saída dentro de 24 h
      responses:
        '200':
          description: Casa reativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/household/export.csv:
    get:
      tags: [Casa]
      operationId: exportHouseholdCsv
      summary: Exporta o histórico compartilhado (HS04)
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }

  # ───────────────────────────── Central de Ajuda ─────────────────────────────
  /v1/help/search:
    get:
      tags: [Central de Ajuda]
      operationId: searchHelp
      summary: Busca nos artigos com resposta rápida que cita a fonte (RF-115)
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpSearchResult' }
              example:
                query: conta conjunta
                answer: { text: 'No modo Dinheiro junto, os salários entram na conta conjunta e tudo sai dela. A Casa mostra o saldo, as entradas, as saídas e a sobra prevista.', sources: [{ slug: /casal/dinheiro-junto, title: Modo Dinheiro junto }] }
                results:
                  - { slug: /casal/dinheiro-junto, title: Modo Dinheiro junto, section: Plano Casal, snippet: 'Os salários vão para uma conta conjunta e tudo sai dela…' }
                  - { slug: /casal/conferir-saldo, title: Conferir o saldo da conjunta, section: Plano Casal, snippet: 'A Arclou não acessa o banco. Compare de vez em quando…' }

  /v1/help/feedback:
    post:
      tags: [Central de Ajuda]
      operationId: sendHelpFeedback
      summary: '"Este artigo ajudou?"'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, helpful]
              properties:
                slug: { type: string, maxLength: 120 }
                helpful: { type: boolean }
                comment: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Obrigado }

components:
  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token do Firebase Auth do ambiente (staging ou production).

  parameters:
    Month:
      name: month
      in: query
      description: 'Mês de referência `AAAA-MM`. Padrão: mês atual no fuso do usuário.'
      schema: { $ref: '#/components/schemas/YearMonth' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUID gerado pelo front. Repetir a mesma chave devolve a mesma resposta (24 h).
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: Não encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://api.arclou.com.br/errors/not_found', title: Não encontrado, status: 404, code: not_found, detail: O recurso não existe ou você não tem acesso a ele. }
    Forbidden:
      description: Sem permissão
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://api.arclou.com.br/errors/forbidden', title: Sem permissão, status: 403, code: not_author, detail: Só quem registrou o lançamento pode mudar a visibilidade. }
    PlanRequired:
      description: Recurso não incluído no plano
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://api.arclou.com.br/errors/plan_required', title: Recurso do plano Pro, status: 403, code: plan_required, detail: Planejamento e metas fazem parte do plano Pro., required_plan: pro }
    Conflict:
      description: Conflito com o estado atual
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://api.arclou.com.br/errors/conflict', title: Conflito, status: 409, code: already_exists, detail: Já existe um limite para esta categoria. }
    Gone:
      description: Expirado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://api.arclou.com.br/errors/expired', title: Expirado, status: 410, code: expired, detail: O prazo para desfazer terminou. }
    TooManyRequests:
      description: Limite de frequência
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://api.arclou.com.br/errors/rate_limited', title: Muitas tentativas, status: 429, code: rate_limited, detail: Você já lembrou o João hoje. }
    ValidationError:
      description: Dados inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'https://api.arclou.com.br/errors/validation'
            title: Dados inválidos
            status: 422
            code: validation_error
            detail: Confira os campos destacados.
            errors:
              - { field: closing_day, code: out_of_range, message: Informe um dia entre 1 e 31. }

  schemas:
    # ── Primitivos ──
    Id: { type: string, format: uuid }
    NextCursor: { type: [string, 'null'] }
    Cents: { type: integer, description: Valor em centavos (pode ser negativo em saldos e saídas) }
    PositiveCents: { type: integer, minimum: 1, description: Valor em centavos maior que zero }
    YearMonth: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-10'] }
    Phone: { type: string, pattern: '^\+?[0-9 ()-]{10,20}$', examples: ['+55 (11) 98765-4321'], description: Número com DDI; a API normaliza para E.164 }
    Cpf: { type: string, pattern: '^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$' }
    HexColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    PlanCode: { type: string, enum: [essencial, pro, casal] }
    Visibility:
      type: string
      enum: [personal, household, split]
      description: 'personal = só o autor vê; household = entra na regra da Casa; split = divisão própria (RN-11.3)'
    MoneyMode:
      type: string
      enum: [joint, separate, mixed]
      description: 'joint = Dinheiro junto; separate = Separado, dividindo as contas; mixed = Misto (RN-11.13)'
    PaymentMethod:
      type: string
      enum: [credit_card, debit, pix, boleto, cash, auto_debit, carne, pix_installments, financing, other]
    InstallmentPaymentMethod:
      type: string
      enum: [credit_card, boleto, carne, pix_installments, financing]
    CardIssuer:
      type: string
      enum: [nubank, neon, itau, bradesco, inter, c6, santander, bb, caixa, mercadopago, other]
    Status3:
      type: string
      enum: [ok, warning, exceeded]
      description: 'ok < 80%; warning ≥ 80%; exceeded ≥ 100%'

    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Código estável para o front decidir a mensagem }
        detail: { type: string }
        required_plan: { $ref: '#/components/schemas/PlanCode' }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    # ── Referências curtas ──
    CategoryRef:
      type: object
      required: [id, name, icon]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        icon: { type: string, description: 'Nome do ícone do design system (utensils, cart, car, home…)' }
    UserRef:
      type: object
      required: [user_id, name, initials]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        initials: { type: string }
    CardRef:
      type: object
      required: [id, nickname]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        nickname: { type: string }
        last4: { type: [string, 'null'] }
        color_hex: { $ref: '#/components/schemas/HexColor' }
    CardColor:
      type: object
      required: [skin, hex, is_custom]
      properties:
        skin: { type: string }
        hex: { $ref: '#/components/schemas/HexColor' }
        is_custom: { type: boolean }
    Quota:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: integer }
        used_pct: { type: integer }
    BeforeAfter:
      type: object
      required: [before_cents, after_cents]
      properties:
        label: { type: string }
        before_cents: { $ref: '#/components/schemas/Cents' }
        after_cents: { $ref: '#/components/schemas/Cents' }
    Step:
      type: object
      required: [key, label, done]
      properties:
        key: { type: string }
        label: { type: string }
        done: { type: boolean }
    Schedule:
      type: object
      description: Regra do dia (RN-09.2, RN-10.1)
      required: [rule, day]
      properties:
        rule: { type: string, enum: [fixed_day, business_day] }
        day: { type: integer, minimum: 1, maximum: 31, description: 'Dia do mês (fixed_day) ou N-ésimo dia útil (business_day)' }
        weekend_shift: { type: string, enum: [before, after], default: before, description: Só para fixed_day }

    # ── Planos e checkout ──
    Plan:
      type: object
      required: [code, name, price_cents, trial_days, seats, features, quotas]
      properties:
        code: { $ref: '#/components/schemas/PlanCode' }
        name: { type: string }
        price_cents: { $ref: '#/components/schemas/PositiveCents' }
        daily_price_cents: { type: integer, description: '"Equivale a R$ 0,66 por dia" (por pessoa no Casal)' }
        trial_days: { type: integer }
        seats: { type: integer }
        highlight: { type: boolean }
        features: { type: array, items: { type: string } }
        quotas:
          type: object
          required: [messages, proactive, receipts]
          properties:
            messages: { type: integer }
            proactive: { type: integer }
            receipts: { type: integer }
    FounderOffer:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        plan_code: { $ref: '#/components/schemas/PlanCode' }
        price_cents: { type: integer }
        months: { type: integer }
        spots_left: { type: integer }
    Coupon:
      type: object
      required: [code, valid]
      properties:
        code: { type: string }
        valid: { type: boolean }
        description: { type: string }
        discount_pct: { type: integer }
        months: { type: integer }
    ConsentInput:
      type: object
      required: [kind, version]
      properties:
        kind: { type: string, enum: [terms_and_privacy, household_privacy, marketing] }
        version: { type: string }
    Consent:
      allOf:
        - $ref: '#/components/schemas/ConsentInput'
        - type: object
          required: [accepted_at]
          properties:
            accepted_at: { type: string, format: date-time }
    CheckoutSession:
      type: object
      required: [id, plan_code, status, price_cents, trial_ends_on, first_charge_on]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        purpose: { type: string, enum: [subscription, payment_method], default: subscription }
        plan_code: { $ref: '#/components/schemas/PlanCode' }
        status: { type: string, enum: [open, awaiting_pix_authorization, completed, declined, expired] }
        payment_method: { type: [string, 'null'], enum: [card, pix_automatic, null] }
        price_cents: { $ref: '#/components/schemas/Cents' }
        first_charge_cents: { $ref: '#/components/schemas/Cents' }
        trial_ends_on: { type: string, format: date }
        first_charge_on: { type: string, format: date }
        coupon: { oneOf: [{ $ref: '#/components/schemas/Coupon' }, { type: 'null' }] }
        card:
          type: object
          properties:
            brand: { type: string }
            last4: { type: string }
        pix:
          type: [object, 'null']
          properties:
            copy_paste: { type: string }
            qr_code_svg: { type: string }
            expires_at: { type: string, format: date-time }
            max_amount_cents: { type: integer }
        receipt_email: { type: string, format: email }
        decline:
          type: [object, 'null']
          properties:
            reason: { type: string, enum: [insufficient_funds, invalid_card, expired_card, suspected_fraud, generic] }
            message: { type: string }

    # ── Conta ──
    Preferences:
      type: object
      required: [timezone, currency, locale]
      properties:
        timezone: { type: string, examples: [America/Sao_Paulo] }
        currency: { type: string, enum: [BRL] }
        locale: { type: string, enum: [pt-BR] }
        week_start: { type: string, enum: [sunday, monday] }
        daily_summary_time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$', description: '`null` desliga o resumo diário' }
        reminder_lead_minutes: { type: integer, minimum: 0, maximum: 1440, description: 0 = sem lembrete }
        default_payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        month_start_day: { type: integer, minimum: 1, maximum: 28, description: Dia em que o "mês financeiro" começa }
        theme: { type: string, enum: [light, dark, system] }
    Me:
      type: object
      required: [id, email, full_name, initials, preferences, plan]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        full_name: { type: string }
        preferred_name: { type: [string, 'null'] }
        initials: { type: string }
        cpf: { type: [string, 'null'] }
        customer_since: { type: string, format: date }
        is_admin: { type: boolean }
        onboarding_completed: { type: boolean }
        preferences: { $ref: '#/components/schemas/Preferences' }
        security:
          type: object
          properties:
            password_set: { type: boolean }
            password_changed_at: { type: [string, 'null'], format: date-time }
            google_linked: { type: boolean }
            google_email: { type: [string, 'null'] }
        plan:
          type: [object, 'null']
          properties:
            code: { $ref: '#/components/schemas/PlanCode' }
            name: { type: string }
            status: { type: string, enum: [trialing, active, past_due, suspended, canceled] }
        household:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Id' }
            role: { type: string, enum: [owner, member] }
    MeUpdate:
      type: object
      properties:
        full_name: { type: string, minLength: 2, maxLength: 80 }
        preferred_name: { type: [string, 'null'], maxLength: 40 }
        cpf: { oneOf: [{ $ref: '#/components/schemas/Cpf' }, { type: 'null' }] }
        preferences:
          type: object
          description: Só os campos enviados mudam
          properties:
            timezone: { type: string }
            week_start: { type: string, enum: [sunday, monday] }
            daily_summary_time: { type: [string, 'null'], pattern: '^\d{2}:\d{2}$' }
            reminder_lead_minutes: { type: integer, minimum: 0, maximum: 1440 }
            default_payment_method: { $ref: '#/components/schemas/PaymentMethod' }
            month_start_day: { type: integer, minimum: 1, maximum: 28 }
            theme: { type: string, enum: [light, dark, system] }
    Overview:
      type: object
      required: [greeting_name, setup, connections, usage, suggestions]
      properties:
        greeting_name: { type: string }
        setup:
          type: object
          required: [completed_steps, total_steps, steps]
          properties:
            completed_steps: { type: integer }
            total_steps: { type: integer }
            next_step: { type: [string, 'null'] }
            message: { type: [string, 'null'] }
            steps: { type: array, items: { $ref: '#/components/schemas/Step' } }
        connections:
          type: object
          additionalProperties:
            type: object
            required: [status, detail]
            properties:
              status: { type: string, enum: [linked, not_linked, pending, connected, not_connected, revoked] }
              detail: { type: string }
        usage:
          type: object
          properties:
            renews_on: { type: string, format: date }
            messages: { $ref: '#/components/schemas/Quota' }
            proactive: { $ref: '#/components/schemas/Quota' }
            receipts: { $ref: '#/components/schemas/Quota' }
        suggestions: { type: array, items: { type: string } }
    Category:
      type: object
      required: [id, name, icon, kind, is_default]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        icon: { type: string }
        kind: { type: string, enum: [expense, income] }
        is_default: { type: boolean }
        budget_group: { type: [string, 'null'], enum: [needs, wants, savings, null], description: Grupo no 50/30/20 }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 30 }
        icon: { type: string }
        kind: { type: string, enum: [expense, income], default: expense }
        budget_group: { type: string, enum: [needs, wants, savings] }

    # ── WhatsApp e integrações ──
    WhatsAppSettings:
      type: object
      properties:
        proactive_opt_in: { type: boolean, description: Autoriza mensagens sem o usuário ter falado antes (RF-06) }
        daily_summary: { type: boolean }
        budget_alerts: { type: boolean }
        insights: { type: boolean }
        partner_notifications: { type: boolean, description: Avisos da Casa (RN-11.10) }
    WhatsAppLink:
      type: object
      required: [status, arclou_contact, settings]
      properties:
        status: { type: string, enum: [not_linked, pending, linked] }
        phone: { type: [string, 'null'] }
        linked_at: { type: [string, 'null'], format: date-time }
        last_message_at: { type: [string, 'null'], format: date-time }
        pending:
          type: [object, 'null']
          properties:
            phone: { type: string }
            code: { type: string, examples: [VINCULAR-7Q4K2M] }
            expires_at: { type: string, format: date-time }
            wa_link: { type: string, format: uri }
        arclou_contact:
          type: object
          required: [phone, wa_link]
          properties:
            display_name: { type: string }
            phone: { type: string }
            wa_link: { type: string, format: uri }
        settings: { $ref: '#/components/schemas/WhatsAppSettings' }
    Integration:
      type: object
      required: [product, status, available_on_plan, calendars]
      properties:
        product: { type: string, enum: [google_calendar, gmail] }
        status: { type: string, enum: [not_connected, pending, connected, revoked, error] }
        account_email: { type: [string, 'null'] }
        connected_at: { type: [string, 'null'], format: date-time }
        available_on_plan: { type: boolean }
        calendars:
          type: array
          items:
            type: object
            required: [id, name, selected]
            properties:
              id: { type: string }
              name: { type: string }
              selected: { type: boolean }
              color: { $ref: '#/components/schemas/HexColor' }

    # ── Assinatura e privacidade ──
    Subscription:
      type: object
      required: [plan, status, cancel_at_period_end]
      properties:
        plan:
          type: object
          required: [code, name, price_cents]
          properties:
            code: { $ref: '#/components/schemas/PlanCode' }
            name: { type: string }
            price_cents: { type: integer }
            seats: { type: integer }
        status: { type: string, enum: [trialing, active, past_due, suspended, canceled] }
        founder_price: { type: boolean }
        trial_ends_on: { type: [string, 'null'], format: date }
        current_period_start: { type: string, format: date }
        current_period_end: { type: string, format: date }
        next_charge_on: { type: [string, 'null'], format: date }
        next_charge_cents: { type: [integer, 'null'] }
        cancel_at_period_end: { type: boolean }
        access_until: { type: [string, 'null'], format: date }
        payment_method:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [card, pix_automatic] }
            brand: { type: [string, 'null'] }
            last4: { type: [string, 'null'] }
            description: { type: string }
        included: { type: array, items: { type: string } }
        grace:
          type: [object, 'null']
          description: Carência por falha de pagamento (RN-02.3)
          properties:
            until: { type: string, format: date }
            message: { type: string }
    Usage:
      type: object
      required: [period_start, period_end, messages, proactive, receipts]
      properties:
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        renews_in_days: { type: integer }
        alert_threshold_pct: { type: integer }
        messages: { $ref: '#/components/schemas/Quota' }
        proactive: { $ref: '#/components/schemas/Quota' }
        receipts: { $ref: '#/components/schemas/Quota' }
    BillingInvoice:
      type: object
      required: [id, date, description, amount_cents, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        date: { type: string, format: date }
        description: { type: string }
        amount_cents: { $ref: '#/components/schemas/Cents' }
        status: { type: string, enum: [scheduled, paid, failed, refunded] }
        receipt_url: { type: [string, 'null'], format: uri }
    PlanChangePreview:
      type: object
      required: [from_plan, to_plan, effective, new_price_cents]
      properties:
        from_plan: { $ref: '#/components/schemas/PlanCode' }
        to_plan: { $ref: '#/components/schemas/PlanCode' }
        effective: { type: string, enum: [immediately, period_end] }
        new_price_cents: { type: integer }
        prorated_charge_cents: { type: integer }
        next_charge_on: { type: string, format: date }
        quota_changes: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
    MemoryFact:
      type: object
      required: [id, fact, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fact: { type: string }
        created_at: { type: string, format: date-time }
    DataExport:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [requested, processing, ready, expired] }
        requested_at: { type: string, format: date-time }
        ready_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        message: { type: string, examples: ['Enviamos o link por e-mail em até 48h.'] }

    # ── Finanças ──
    FinanceOverview:
      type: object
      required: [month, month_label, income, spent, available, categories, insights, evolution, top_expenses]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        month_label: { type: string }
        is_current_month: { type: boolean }
        income:
          type: object
          required: [total_cents]
          properties:
            total_cents: { $ref: '#/components/schemas/Cents' }
            note: { type: string }
        spent:
          type: object
          required: [total_cents]
          properties:
            total_cents: { $ref: '#/components/schemas/Cents' }
            vs_previous_pct: { type: [number, 'null'] }
            comparison_label: { type: string }
        available:
          type: object
          required: [total_cents, daily_cents, until]
          properties:
            total_cents: { $ref: '#/components/schemas/Cents' }
            daily_cents: { $ref: '#/components/schemas/Cents' }
            until: { type: string, format: date }
        goals:
          type: [object, 'null']
          description: '`null` no Essencial'
          properties:
            saved_this_month_cents: { type: integer }
            on_track: { type: integer }
            total: { type: integer }
        categories:
          type: array
          items:
            type: object
            required: [category, amount_cents, share_pct]
            properties:
              category: { $ref: '#/components/schemas/CategoryRef' }
              amount_cents: { $ref: '#/components/schemas/Cents' }
              share_pct: { type: number }
              change_pct: { type: [number, 'null'] }
        insights: { type: array, items: { $ref: '#/components/schemas/Insight' } }
        evolution:
          type: array
          items:
            type: object
            required: [month, spent_cents, income_cents, projected]
            properties:
              month: { $ref: '#/components/schemas/YearMonth' }
              spent_cents: { type: integer }
              income_cents: { type: integer }
              projected: { type: boolean }
        previous_month:
          type: [object, 'null']
          properties:
            month: { $ref: '#/components/schemas/YearMonth' }
            label: { type: string }
            spent_cents: { type: integer }
            vs_previous_pct: { type: number }
        top_expenses: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
    Insight:
      type: object
      required: [id, kind, severity, title, body]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [category_growing, new_recurring, unusual_expense, goal_behind, forgotten_subscription, limit_projection] }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
    Transaction:
      type: object
      required: [id, occurred_on, description, amount_cents, kind, category, payment_method, visibility, status, can_edit]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        occurred_on: { type: string, format: date }
        description: { type: string }
        amount_cents: { $ref: '#/components/schemas/Cents' }
        kind: { type: string, enum: [expense, income] }
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        card: { oneOf: [{ $ref: '#/components/schemas/CardRef' }, { type: 'null' }] }
        source: { type: string, enum: [text, audio, image, panel, recurring, installment] }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { type: string, enum: [expected, done] }
        can_edit: { type: boolean, description: true só para o autor }
        installment: { type: [object, 'null'], properties: { plan_id: { $ref: '#/components/schemas/Id' }, number: { type: integer }, total: { type: integer } } }
        author: { $ref: '#/components/schemas/UserRef' }
        paid_by: { $ref: '#/components/schemas/UserRef' }
        household:
          type: [object, 'null']
          description: Presente em itens `household`/`split`
          properties:
            payment_origin: { type: string, enum: [joint_account, member] }
            private: { type: boolean }
            split:
              type: object
              properties:
                owner_pct: { type: integer }
                member_pct: { type: integer }
                label: { type: string }
                custom: { type: boolean }
            shares: { type: array, items: { $ref: '#/components/schemas/Share' } }
    Share:
      type: object
      required: [user_id, name, share_cents]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        share_cents: { $ref: '#/components/schemas/Cents' }
    TransactionInput:
      type: object
      required: [kind, amount_cents, occurred_on, description]
      properties:
        kind: { type: string, enum: [expense, income], default: expense }
        amount_cents: { $ref: '#/components/schemas/PositiveCents' }
        occurred_on: { type: string, format: date }
        description: { type: string, maxLength: 120 }
        category_id: { $ref: '#/components/schemas/Id' }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        card_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        visibility: { $ref: '#/components/schemas/Visibility' }
        split_owner_pct: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Só para `split` }
        payment_origin: { type: string, enum: [joint_account, member], description: Só na Casa com conta conjunta }
        private: { type: boolean, default: false, description: Só para `payment_origin = joint_account` (RN-11.15) }
    TransactionUpdate:
      type: object
      properties:
        amount_cents: { $ref: '#/components/schemas/PositiveCents' }
        occurred_on: { type: string, format: date }
        description: { type: string, maxLength: 120 }
        category_id: { $ref: '#/components/schemas/Id' }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        card_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    VisibilityInput:
      type: object
      required: [visibility]
      properties:
        visibility: { $ref: '#/components/schemas/Visibility' }
        split_owner_pct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        payment_origin: { type: string, enum: [joint_account, member] }
        private: { type: boolean }
    TransactionEffects:
      type: object
      required: [shares, messages]
      properties:
        shares: { type: array, items: { $ref: '#/components/schemas/Share' } }
        joint_balance_after_cents: { type: [integer, 'null'] }
        household_balance_after:
          type: [object, 'null']
          properties:
            debtor_name: { type: string }
            creditor_name: { type: string }
            before_cents: { type: integer }
            after_cents: { type: integer }
        limit_alerts: { type: array, items: { type: string } }
        messages: { type: array, items: { type: string } }

    Income:
      type: object
      required: [id, kind, description, amount_cents, variable]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [recurring, extra] }
        description: { type: string }
        schedule_label: { type: string }
        schedule: { oneOf: [{ $ref: '#/components/schemas/Schedule' }, { type: 'null' }] }
        amount_cents: { $ref: '#/components/schemas/Cents' }
        variable: { type: boolean }
        received_on: { type: [string, 'null'], format: date }
        occurrence: { oneOf: [{ $ref: '#/components/schemas/IncomeOccurrence' }, { type: 'null' }] }
    IncomeInput:
      type: object
      required: [kind, description, amount_cents]
      properties:
        kind: { type: string, enum: [recurring, extra] }
        description: { type: string, maxLength: 80 }
        amount_cents: { $ref: '#/components/schemas/PositiveCents' }
        variable: { type: boolean, default: false, description: 'Ex.: comissão. Previsão = média dos últimos 3 meses' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        received_on: { type: string, format: date, description: Só para `extra` }
        to_joint_account: { type: boolean, default: false, description: Entrada na conjunta (RN-11.14) }
    IncomeOccurrence:
      type: object
      required: [id, expected_on, expected_cents, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        expected_on: { type: string, format: date }
        expected_cents: { type: integer }
        status: { type: string, enum: [expected, received, missed] }
        received_on: { type: [string, 'null'], format: date }
        received_cents: { type: [integer, 'null'] }
    IncomePreviewItem:
      type: object
      required: [expected_on, weekday, amount_cents]
      properties:
        expected_on: { type: string, format: date }
        weekday: { type: string }
        amount_cents: { type: integer }
        note: { type: [string, 'null'] }
    IncomeMonth:
      type: object
      required: [month, total_cents, items]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        total_cents: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Income' } }
        next_expected:
          type: [object, 'null']
          properties:
            description: { type: string }
            expected_on: { type: string, format: date }
            amount_cents: { type: integer }

    CategoryLimit:
      type: object
      required: [id, category, limit_cents, spent_cents, used_pct, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        category: { $ref: '#/components/schemas/CategoryRef' }
        limit_cents: { $ref: '#/components/schemas/PositiveCents' }
        spent_cents: { type: integer }
        used_pct: { type: integer }
        status: { $ref: '#/components/schemas/Status3' }
        projected_exceed_on: { type: [string, 'null'], format: date, description: '"No ritmo atual, passa do limite no dia 24"' }
    Limits:
      type: object
      required: [month, general, categories, categories_without_limit]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        general:
          type: [object, 'null']
          properties:
            limit_cents: { type: integer }
            spent_cents: { type: integer }
            used_pct: { type: integer }
            projection_cents: { type: integer }
            projection_pct: { type: integer }
            status: { $ref: '#/components/schemas/Status3' }
        suggestion:
          type: [object, 'null']
          properties:
            max_limit_cents: { type: integer }
            savings_pct: { type: integer }
            message: { type: string }
        alert_thresholds: { type: array, items: { type: integer } }
        categories: { type: array, items: { $ref: '#/components/schemas/CategoryLimit' } }
        categories_without_limit: { type: array, items: { $ref: '#/components/schemas/CategoryRef' } }
    BudgetModel:
      type: object
      required: [needs_pct, wants_pct, savings_pct]
      description: A soma precisa ser 100
      properties:
        needs_pct: { type: integer, minimum: 0, maximum: 100 }
        wants_pct: { type: integer, minimum: 0, maximum: 100 }
        savings_pct: { type: integer, minimum: 0, maximum: 100 }
        category_groups:
          type: object
          description: '`category_id → needs|wants|savings`'
          additionalProperties: { type: string, enum: [needs, wants, savings] }
    MonthPlan:
      type: object
      required: [month, model, buckets, leftover, bills_due]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        model: { $ref: '#/components/schemas/BudgetModel' }
        buckets:
          type: array
          items:
            type: object
            required: [key, label, pct, planned_cents, actual_cents, used_pct, status]
            properties:
              key: { type: string, enum: [needs, wants, savings] }
              label: { type: string }
              pct: { type: integer }
              description: { type: string }
              planned_cents: { type: integer }
              actual_cents: { type: integer }
              used_pct: { type: integer }
              status: { $ref: '#/components/schemas/Status3' }
              note: { type: [string, 'null'] }
        leftover:
          type: object
          required: [on, income_cents, expected_spending_cents, bills_due_cents, goal_contributions_cents, leftover_cents]
          properties:
            on: { type: string, format: date }
            income_cents: { type: integer }
            expected_spending_cents: { type: integer }
            bills_due_cents: { type: integer }
            goal_contributions_cents: { type: integer }
            leftover_cents: { type: integer }
            note: { type: string }
        bills_due:
          type: object
          required: [total_cents, items]
          properties:
            total_cents: { type: integer }
            items: { type: array, items: { $ref: '#/components/schemas/BillDue' } }
    BillDue:
      type: object
      required: [due_on, description, amount_cents, status]
      properties:
        due_on: { type: string, format: date }
        description: { type: string }
        category_name: { type: string }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        amount_cents: { type: integer }
        estimated: { type: boolean }
        status: { type: string, enum: [expected, paid] }
        source:
          type: object
          properties:
            type: { type: string, enum: [recurring_expense, installment, card_invoice] }
            id: { $ref: '#/components/schemas/Id' }
    Goal:
      type: object
      required: [id, name, target_cents, saved_cents, progress_pct, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        icon: { type: string }
        kept_at: { type: [string, 'null'], description: Onde o dinheiro fica guardado }
        target_cents: { type: integer }
        saved_cents: { type: integer }
        progress_pct: { type: integer }
        deadline: { type: [string, 'null'], format: date }
        status: { type: string, enum: [on_track, behind, done, paused] }
        monthly_suggestion_cents: { type: [integer, 'null'] }
        message: { type: string }
    GoalInput:
      type: object
      required: [name, target_cents]
      properties:
        name: { type: string, maxLength: 60 }
        icon: { type: string }
        target_cents: { $ref: '#/components/schemas/PositiveCents' }
        deadline: { type: [string, 'null'], format: date }
        kept_at: { type: [string, 'null'], maxLength: 60 }
        initial_saved_cents: { type: integer, minimum: 0, default: 0 }
    GoalsSummary:
      type: object
      required: [monthly_required_cents, within_budget]
      properties:
        monthly_required_cents: { type: integer }
        savings_budget_cents: { type: integer }
        within_budget: { type: boolean }
        label: { type: string }
    PurchaseSimulation:
      type: object
      required: [verdict, installment_cents, current_month, following_months, messages, disclaimer]
      properties:
        verdict: { type: string, enum: [fits, tight, negative] }
        installment_cents: { type: integer }
        current_month:
          type: object
          properties:
            month: { $ref: '#/components/schemas/YearMonth' }
            available_before_cents: { type: integer }
            available_after_cents: { type: integer }
            daily_after_cents: { type: integer }
        following_months:
          type: array
          items:
            type: object
            properties:
              month: { $ref: '#/components/schemas/YearMonth' }
              committed_added_cents: { type: integer }
        goals_on_track: { type: boolean }
        category_limit_used_pct_after: { type: [integer, 'null'] }
        messages: { type: array, items: { type: string } }
        disclaimer: { type: string }

    # ── Compromissos ──
    Commitments:
      type: object
      required: [attention_pct, months]
      properties:
        attention_pct: { type: integer }
        critical_pct: { type: integer, default: 70 }
        income_reference_cents: { type: integer }
        headline: { $ref: '#/components/schemas/CommitmentMonth' }
        months: { type: array, items: { $ref: '#/components/schemas/CommitmentMonth' } }
        endings: { type: array, items: { type: string } }
    CommitmentMonth:
      type: object
      required: [month, recurring_cents, installments_cents, total_cents, pct_of_income, status]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        recurring_cents: { type: integer }
        installments_cents: { type: integer }
        total_cents: { type: integer }
        pct_of_income: { type: integer }
        status: { type: string, enum: [ok, attention, critical] }
    RecurringExpense:
      type: object
      required: [id, description, category, schedule, payment_method, amount_cents, variable, active]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        description: { type: string }
        category: { $ref: '#/components/schemas/CategoryRef' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        due_label: { type: string }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        card: { oneOf: [{ $ref: '#/components/schemas/CardRef' }, { type: 'null' }] }
        amount_cents: { type: integer }
        variable: { type: boolean, description: Valor estimado (~) }
        active: { type: boolean }
        paused_until: { type: [string, 'null'], format: date }
        visibility: { $ref: '#/components/schemas/Visibility' }
        current:
          type: [object, 'null']
          properties:
            month: { $ref: '#/components/schemas/YearMonth' }
            due_on: { type: string, format: date }
            status: { type: string, enum: [expected, paid, skipped] }
            transaction_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    RecurringExpenseInput:
      type: object
      required: [description, category_id, schedule, payment_method, amount_cents]
      properties:
        description: { type: string, maxLength: 80 }
        category_id: { $ref: '#/components/schemas/Id' }
        schedule: { $ref: '#/components/schemas/Schedule' }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
        card_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        amount_cents: { $ref: '#/components/schemas/PositiveCents' }
        variable: { type: boolean, default: false }
        visibility: { $ref: '#/components/schemas/Visibility' }
    Card:
      type: object
      required: [id, issuer, nickname, color, closing_day, due_day]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        issuer: { $ref: '#/components/schemas/CardIssuer' }
        nickname: { type: string }
        last4: { type: [string, 'null'], pattern: '^\d{4}$' }
        holder_display_name: { type: string, description: Nome do usuário em maiúsculas para a arte ilustrativa }
        color: { $ref: '#/components/schemas/CardColor' }
        closing_day: { type: integer, minimum: 1, maximum: 31 }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        limit_cents: { type: [integer, 'null'] }
        current_invoice: { oneOf: [{ $ref: '#/components/schemas/CardInvoice' }, { type: 'null' }] }
        committed_cents: { type: integer, description: Fatura atual + parcelas futuras }
        active_installment_plans: { type: integer }
        household: { type: boolean, description: Cartão da conta conjunta (visível aos dois) }
    CardInput:
      type: object
      required: [issuer, nickname, closing_day, due_day]
      properties:
        issuer: { $ref: '#/components/schemas/CardIssuer' }
        nickname: { type: string, maxLength: 30 }
        last4: { type: [string, 'null'], pattern: '^\d{4}$' }
        closing_day: { type: integer, minimum: 1, maximum: 31 }
        due_day: { type: integer, minimum: 1, maximum: 31 }
        limit_cents: { type: [integer, 'null'], minimum: 1 }
        color_skin: { type: string, description: Uma das 13 cores; padrão = cor do banco }
        custom_color: { oneOf: [{ $ref: '#/components/schemas/HexColor' }, { type: 'null' }] }
        household: { type: boolean, default: false }
    CardInvoice:
      type: object
      required: [id, closes_on, due_on, status, total_cents]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        closes_on: { type: string, format: date }
        due_on: { type: string, format: date }
        status: { type: string, enum: [open, closed, paid] }
        total_cents: { type: integer }
    InstallmentPlan:
      type: object
      required: [id, description, category, payment_method, payment_label, total_cents, installments, installment_cents, paid_count, remaining_cents, status, allowed_actions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        description: { type: string }
        category: { $ref: '#/components/schemas/CategoryRef' }
        payment_method: { $ref: '#/components/schemas/InstallmentPaymentMethod' }
        card: { oneOf: [{ $ref: '#/components/schemas/CardRef' }, { type: 'null' }] }
        due_day: { type: [integer, 'null'], description: Fora do cartão }
        payment_label: { type: string, examples: ['Nubank •••• 4821', 'Boleto · vence dia 15'] }
        purchased_on: { type: string, format: date }
        total_cents: { type: integer }
        installments: { type: integer }
        installment_cents: { type: integer }
        interest_cents: { type: integer }
        paid_count: { type: integer }
        next_due_on: { type: [string, 'null'], format: date }
        last_due_on: { type: string, format: date }
        remaining_cents: { type: integer }
        status: { type: string, enum: [active, settled, canceled] }
        visibility: { $ref: '#/components/schemas/Visibility' }
        allowed_actions:
          type: array
          items: { type: string, enum: [view_schedule, edit, payoff, cancel, register_payment] }
    InstallmentPlanDetail:
      allOf:
        - $ref: '#/components/schemas/InstallmentPlan'
        - type: object
          required: [schedule]
          properties:
            paid_cents: { type: integer }
            schedule:
              type: array
              items:
                type: object
                required: [number, due_on, label, amount_cents, status]
                properties:
                  number: { type: integer }
                  due_on: { type: string, format: date }
                  invoice_due_on: { type: [string, 'null'], format: date }
                  label: { type: string, examples: ['Fatura de 05/11/2026', 'Vence em 10/11/2026'] }
                  amount_cents: { type: integer }
                  status: { type: string, enum: [paid, next, pending, canceled] }
                  paid_on: { type: [string, 'null'], format: date }
    InstallmentSummary:
      type: object
      required: [remaining_cents, remaining_installments, plans_count, by_method, counts]
      properties:
        remaining_cents: { type: integer }
        remaining_installments: { type: integer }
        plans_count: { type: integer }
        next_month: { $ref: '#/components/schemas/YearMonth' }
        next_month_cents: { type: integer }
        by_method:
          type: object
          additionalProperties: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
    InstallmentPlanInput:
      type: object
      required: [payment_method, description, category_id, installments, purchased_on]
      properties:
        payment_method: { $ref: '#/components/schemas/InstallmentPaymentMethod' }
        card_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: Obrigatório no cartão }
        due_day: { type: [integer, 'null'], minimum: 1, maximum: 31, description: Obrigatório fora do cartão }
        first_due_month: { oneOf: [{ $ref: '#/components/schemas/YearMonth' }, { type: 'null' }], description: 'Fora do cartão; padrão = mês seguinte à compra' }
        description: { type: string, maxLength: 80 }
        category_id: { $ref: '#/components/schemas/Id' }
        total_cents: { type: [integer, 'null'], minimum: 1, description: 'Obrigatório, exceto no financiamento' }
        installment_cents: { type: [integer, 'null'], minimum: 1, description: 'Financiamento: valor da parcela' }
        installments: { type: integer, minimum: 2, maximum: 120 }
        interest_cents: { type: integer, minimum: 0, default: 0 }
        purchased_on: { type: string, format: date }
        visibility: { $ref: '#/components/schemas/Visibility' }
    InstallmentPlanUpdate:
      type: object
      properties:
        description: { type: string, maxLength: 80 }
        category_id: { $ref: '#/components/schemas/Id' }
        total_cents: { type: integer, minimum: 1 }
        installments: { type: integer, minimum: 2, maximum: 120 }
        purchased_on: { type: string, format: date }
        due_day: { type: integer, minimum: 1, maximum: 31 }
    InstallmentPlanPreview:
      type: object
      required: [installment_cents, headline, schedule, messages]
      properties:
        installment_cents: { type: integer }
        remainder_cents: { type: integer, description: Resto de centavos somado à 1ª parcela }
        headline: { type: string }
        badge:
          type: [object, 'null']
          properties:
            kind: { type: string, enum: [ok, warning, critical] }
            label: { type: string }
        schedule:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              month: { $ref: '#/components/schemas/YearMonth' }
              due_on: { type: string, format: date }
              invoice_due_on: { type: [string, 'null'], format: date }
              amount_cents: { type: integer }
        commitment_impact:
          type: [object, 'null']
          properties:
            month: { $ref: '#/components/schemas/YearMonth' }
            before_cents: { type: integer }
            after_cents: { type: integer }
            pct_of_income: { type: integer }
            above_attention: { type: boolean }
        messages:
          type: array
          items:
            type: object
            required: [kind, text]
            properties:
              kind: { type: string, enum: [ok, warning, critical] }
              text: { type: string }
    PayoffInput:
      type: object
      required: [payoff_cents]
      properties:
        payoff_cents: { $ref: '#/components/schemas/PositiveCents' }
        paid_on: { type: string, format: date }
    PayoffPreview:
      type: object
      required: [remaining_installments, remaining_cents, payoff_cents, savings_cents, messages]
      properties:
        remaining_installments: { type: integer }
        remaining_cents: { type: integer }
        payoff_cents: { type: integer }
        savings_cents: { type: integer }
        messages: { type: array, items: { type: string } }
        hint: { type: [string, 'null'] }

    # ── Casa ──
    HouseholdMember:
      type: object
      required: [user_id, name, initials, role, is_me]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        name: { type: string, description: '"Ex-membro" se a pessoa excluiu a conta (RN-11.12)' }
        initials: { type: string }
        color: { $ref: '#/components/schemas/HexColor' }
        role: { type: string, enum: [owner, member] }
        is_me: { type: boolean }
        share_pct: { type: [integer, 'null'] }
        notify_partner: { type: boolean }
    SplitRuleInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [equal, income_ratio, custom, per_item] }
        owner_pct: { type: [integer, 'null'], minimum: 1, maximum: 99, description: Só para `custom` }
        my_monthly_income_cents: { type: [integer, 'null'], minimum: 1, description: 'Só para `income_ratio`; nunca é mostrado ao outro' }
    Household:
      type: object
      required: [id, name, status, my_role, members, money_mode, split_rule, has_joint_account]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        status: { type: string, enum: [active, leaving, read_only] }
        read_only_until: { type: [string, 'null'], format: date }
        my_role: { type: string, enum: [owner, member] }
        members: { type: array, items: { $ref: '#/components/schemas/HouseholdMember' }, maxItems: 2 }
        money_mode: { $ref: '#/components/schemas/MoneyMode' }
        money_mode_change:
          type: [object, 'null']
          description: Troca aguardando o outro confirmar
          properties:
            to: { $ref: '#/components/schemas/MoneyMode' }
            requested_by: { type: string }
            requested_at: { type: string, format: date-time }
            awaiting: { type: string, examples: ['O João confirma pelo WhatsApp'] }
        split_rule:
          type: object
          required: [type, label]
          properties:
            type: { type: string, enum: [equal, income_ratio, custom, per_item] }
            owner_pct: { type: integer }
            member_pct: { type: integer }
            label: { type: string }
            pending:
              type: [object, 'null']
              properties:
                type: { type: string }
                requested_by: { type: string }
                awaiting: { type: string }
            fallback_reason: { type: [string, 'null'], description: 'Ex.: falta a renda de alguém → 50/50' }
        has_joint_account: { type: boolean }
        invite: { oneOf: [{ $ref: '#/components/schemas/HouseholdInvite' }, { type: 'null' }] }
        leave:
          type: [object, 'null']
          properties:
            requested_at: { type: string, format: date-time }
            undo_until: { type: string, format: date-time }
            summary: { type: string }
    HouseholdInvite:
      type: object
      required: [code, status, expires_at, link, share_text, whatsapp_share_url, steps]
      properties:
        code: { type: string, pattern: '^CASA-[A-Z0-9]{4}$' }
        status: { type: string, enum: [pending, accepted, awaiting_confirmation, joined, expired, canceled] }
        invited_name: { type: [string, 'null'] }
        invited_phone: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        link: { type: string, format: uri }
        share_text: { type: string }
        whatsapp_share_url: { type: string, format: uri }
        steps: { type: array, items: { $ref: '#/components/schemas/Step' } }
        phone_mismatch:
          type: [object, 'null']
          description: O número que mandou ENTRAR é diferente do informado → titular confirma
          properties:
            joined_from_phone: { type: string }
    PublicInvite:
      type: object
      required: [code, status, inviter_name, expires_at, privacy_summary, terms_version]
      properties:
        code: { type: string }
        status: { type: string, enum: [pending, accepted, joined, expired, canceled] }
        inviter_name: { type: string }
        plan_paid_by_inviter: { type: boolean }
        expires_at: { type: string, format: date-time }
        privacy_summary:
          type: object
          properties:
            shared: { type: array, items: { type: string } }
            never_shared: { type: array, items: { type: string } }
        terms_version: { type: string }
    InviteProgress:
      type: object
      required: [code, step, status]
      properties:
        code: { type: string }
        step: { type: string, enum: [accept, split, whatsapp, done] }
        status: { type: string, enum: [pending, awaiting_split, awaiting_whatsapp, awaiting_owner_confirmation, joined] }
        split_proposal:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [equal, income_ratio, custom, per_item] }
            proposed_by: { type: string }
            my_pct: { type: [integer, 'null'] }
            example_text: { type: string }
            warning: { type: [string, 'null'] }
            needs_my_income: { type: boolean }
        whatsapp:
          type: [object, 'null']
          properties:
            message: { type: string }
            arclou_phone: { type: string }
            wa_link: { type: string, format: uri }
            expected_phone: { type: [string, 'null'] }
    HouseholdOverview:
      type: object
      required: [month, spending, budgets, goals]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        balance:
          type: [object, 'null']
          description: '`null` no modo Dinheiro junto (não existe quem deve quem)'
          properties:
            month_label: { type: string }
            debtor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
            creditor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
            amount_cents: { type: integer }
            headline: { type: string, examples: ['João te deve', 'Você deve ao João', 'Tudo certo entre vocês'] }
            members:
              type: array
              items:
                type: object
                properties:
                  user_id: { $ref: '#/components/schemas/Id' }
                  name: { type: string }
                  pct: { type: integer }
                  paid_cents: { type: integer }
                  share_cents: { type: integer }
        spending:
          type: object
          properties:
            total_cents: { type: integer }
            categories:
              type: array
              items:
                type: object
                properties:
                  category: { $ref: '#/components/schemas/CategoryRef' }
                  amount_cents: { type: integer }
        budgets: { type: array, items: { $ref: '#/components/schemas/CategoryLimit' } }
        goals: { type: array, items: { $ref: '#/components/schemas/HouseholdGoal' } }
        mixed:
          type: [object, 'null']
          description: Modo Misto — aportes sugeridos e reembolsos (RN-11.16, RN-11.17)
          properties:
            target_cents: { type: integer }
            contributions:
              type: array
              items:
                type: object
                properties:
                  user_id: { $ref: '#/components/schemas/Id' }
                  name: { type: string }
                  suggested_cents: { type: integer }
                  contributed_cents: { type: integer }
                  missing_cents: { type: integer }
            reimbursements:
              type: array
              items:
                type: object
                properties:
                  user_id: { $ref: '#/components/schemas/Id' }
                  name: { type: string }
                  amount_cents: { type: integer }
                  label: { type: string }
    HouseholdGoal:
      type: object
      required: [id, name, target_cents, saved_cents, status, members]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        icon: { type: string }
        target_cents: { type: integer }
        saved_cents: { type: integer }
        deadline: { type: [string, 'null'], format: date }
        status: { type: string, enum: [on_track, behind, done, paused] }
        this_month_cents: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              saved_cents: { type: integer }
              suggested_monthly_cents: { type: integer }
    Settlement:
      type: object
      required: [id, from, to, amount_cents, method, settled_on]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        from: { $ref: '#/components/schemas/UserRef' }
        to: { $ref: '#/components/schemas/UserRef' }
        amount_cents: { type: integer }
        method: { type: string, enum: [pix, cash, carry_over] }
        settled_on: { type: string, format: date }
        note: { type: [string, 'null'] }
        balance_after_cents: { type: integer }
    JointAccount:
      type: object
      required: [id, name, color, month, balance_today_cents, opening, inflows_cents, outflows_cents, to_goals_cents, forecast]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        color: { $ref: '#/components/schemas/CardColor' }
        month: { $ref: '#/components/schemas/YearMonth' }
        balance_today_cents: { type: integer }
        last_reconciled_on: { type: [string, 'null'], format: date }
        opening:
          type: object
          properties:
            on: { type: string, format: date }
            balance_cents: { type: integer }
        inflows_cents: { type: integer }
        outflows_cents: { type: integer }
        to_goals_cents: { type: integer }
        inflow_items:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount_cents: { type: integer }
        forecast:
          type: object
          properties:
            on: { type: string, format: date }
            leftover_cents: { type: integer }
            due_total_cents: { type: integer }
            due_items:
              type: array
              items:
                type: object
                properties:
                  due_on: { type: string, format: date }
                  description: { type: string }
                  amount_cents: { type: integer }
        by_category:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount_cents: { type: integer }
        reimbursements:
          type: array
          items:
            type: object
            properties:
              user_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              amount_cents: { type: integer }
        suggested_contributions:
          type: [array, 'null']
          items:
            type: object
            properties:
              user_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              suggested_cents: { type: integer }
              contributed_cents: { type: integer }
    JointMovement:
      type: object
      required: [id, kind, occurred_on, title, amount_cents, private, author, can_edit]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [expense, income, contribution, reimbursement, goal_transfer, adjustment] }
        occurred_on: { type: string, format: date }
        title: { type: string }
        subtitle: { type: string }
        amount_cents: { type: integer, description: Positivo = entrou; negativo = saiu }
        private: { type: boolean }
        author: { $ref: '#/components/schemas/UserRef' }
        transaction_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        can_edit: { type: boolean }
    JointEntryInput:
      type: object
      required: [kind, amount_cents, occurred_on]
      properties:
        kind: { type: string, enum: [income, contribution, reimbursement, goal_transfer, adjustment] }
        amount_cents: { type: integer, description: 'Positivo; no ajuste pode ser negativo' }
        occurred_on: { type: string, format: date }
        description: { type: string, maxLength: 80 }
        member_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: Reembolso para quem }
        goal_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
    ReconciliationPreview:
      type: object
      required: [app_balance_cents, bank_balance_cents, difference_cents, suggestions, unexplained_cents]
      properties:
        app_balance_cents: { type: integer }
        bank_balance_cents: { type: integer }
        difference_cents: { type: integer }
        suggestions:
          type: array
          items:
            type: object
            required: [id, description, amount_cents, selected]
            properties:
              id: { type: string }
              description: { type: string }
              hint: { type: string }
              amount_cents: { type: integer }
              selected: { type: boolean }
        selected_total_cents: { type: integer }
        unexplained_cents: { type: integer }
        message: { type: string }
    LeavePreview:
      type: object
      required: [items, history_read_only_until, undo_window_hours, confirmation_word]
      properties:
        joint_account_last_balance_cents: { type: [integer, 'null'] }
        pending_balance:
          type: [object, 'null']
          properties:
            headline: { type: string }
            amount_cents: { type: integer }
        goals:
          type: array
          items:
            type: object
            properties:
              goal_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              mine_cents: { type: integer }
              partner_cents: { type: integer }
        history_read_only_until: { type: string, format: date }
        my_plan_after:
          type: object
          properties:
            code: { $ref: '#/components/schemas/PlanCode' }
            price_cents: { type: integer }
            label: { type: string }
        partner_plan_after: { type: string }
        partner_notice: { type: string }
        items:
          type: array
          items:
            type: object
            required: [key, title, body]
            properties:
              key: { type: string }
              title: { type: string }
              body: { type: string }
        undo_window_hours: { type: integer }
        confirmation_word: { type: string }

    # ── Central de Ajuda ──
    HelpSearchResult:
      type: object
      required: [query, results]
      properties:
        query: { type: string }
        answer:
          type: [object, 'null']
          description: Só aparece quando há trechos relevantes (nunca inventa)
          properties:
            text: { type: string }
            sources:
              type: array
              items:
                type: object
                properties:
                  slug: { type: string }
                  title: { type: string }
        results:
          type: array
          items:
            type: object
            required: [slug, title]
            properties:
              slug: { type: string }
              title: { type: string }
              section: { type: string }
              snippet: { type: string }

