# Instale com: make setup   (ou: pre-commit install --install-hooks -t pre-commit -t commit-msg)
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Python (backend/) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|scripts)/
      - id: ruff-format
        files: ^(backend|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/src/

  # ── Front (web/) ──
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        language: node
        additional_dependencies: [prettier@3.3.3]
        entry: prettier --write --ignore-unknown
        files: ^web/
      - id: eslint
        name: eslint (web)
        language: system
        entry: bash -c 'test -f web/package.json || exit 0; npm --prefix web run --silent lint'
        files: ^web/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # ── Terraform (infra/terraform/) ──
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]

  # ── Mensagem de commit ──
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional@19.5.0']
